# Development overlay: your working tree is mounted into the containers, the
# API reloads on save and the dashboard runs Vite with hot module reload.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# or once, in .env, so plain `docker compose up` means this:
#
#   COMPOSE_FILE=compose.yaml:compose.dev.yaml      (use ; on Windows)
#
# The image is still built first: it is where the Python packages live. Rebuild
# only when a requirements-*.txt changes.

x-dev-api: &dev-api
  volumes:
    - .:/app
  # --reload watches the four code packages only. Watching the whole tree
  # means watching data/ and frontend/node_modules, which is slow through a
  # bind mount.
  command: &dev-uvicorn >-
    uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    --reload --reload-dir backend --reload-dir survey_hazard_map --reload-dir ghosttrace --reload-dir rag_assistant

services:
  assistant:
    <<: *dev-api
    # The retrieval index is gitignored and the mount above hides the one built
    # into the image, so build it if this checkout has none. An existing one is
    # left alone: it may have been built with a different embedder on purpose.
    # Only here, not in the shared block: three containers building the same
    # files at once would race.
    command:
      - sh
      - -c
      - >-
        { test -f rag_assistant/index.json || python -m rag_assistant.rag index; } &&
        exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
        --reload --reload-dir backend --reload-dir survey_hazard_map --reload-dir ghosttrace --reload-dir rag_assistant
  hazard:
    <<: *dev-api
  ghosttrace:
    <<: *dev-api

  frontend:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      # node_modules stays in a volume: packages installed on macOS or Windows
      # carry native binaries that do not run in a Linux container.
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: !override ["5173:5173"]

volumes:
  frontend_node_modules:
