# DeepEcho, one container per feature.
#
#   docker compose up --build            everything, at http://localhost:5173
#   docker compose up -d --build hazard  rebuild and restart ONE feature
#   docker compose up gateway assistant  only what you are working on
#
# For editing with live reload, add the dev overlay (docs/DOCKER.md):
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
#   browser ──> frontend   :5173   the dashboard, static files
#          └──> gateway    :8000   routes each API path to its feature
#                 ├── assistant   :8001   /chat /rag /sources
#                 ├── hazard      :8002   /survey /hazard /history /stats /detect…
#                 └── ghosttrace  :8003   /ghosttrace
#
# The three features are ONE image (./Dockerfile) started three times with a
# different DEEPECHO_FEATURES. They share code on purpose: history asks the
# assistant's policy for a severity, the assistant's copilot reads the surveys.
# What is separate is the process, so each can be rebuilt, restarted, scaled,
# given its own secrets, or deployed to its own host.

x-api: &api
  image: deepecho-api:${DEEPECHO_PROFILE:-serve}
  build:
    context: .
    args:
      # serve: no torch, about 350 MB. full: adds ultralytics and the
      # checkpoints for tile upload and survey processing, about 1.3 GB.
      #   DEEPECHO_PROFILE=full docker compose up --build
      PROFILE: ${DEEPECHO_PROFILE:-serve}
  # Keys live in .env (copy .env.example). Optional, so a teammate with no keys
  # still gets the maps, the surveys and the assistant's offline fallback.
  env_file:
    - path: .env
      required: false
  volumes:
    # Surveys are the features' shared ground: a job the hazard container
    # finishes is what GhostTrace ranks and what the copilot answers from.
    # A bind mount, so they are also plain files on your machine.
    - ./data:/app/data
  restart: unless-stopped
  healthcheck:
    # python, because the slim image has neither curl nor wget.
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
    interval: 30s
    timeout: 5s
    start_period: 40s
    retries: 3

services:
  assistant:
    <<: *api
    environment:
      DEEPECHO_FEATURES: assistant
    ports: ["8001:8000"]

  hazard:
    <<: *api
    environment:
      DEEPECHO_FEATURES: hazard
    ports: ["8002:8000"]

  ghosttrace:
    <<: *api
    environment:
      DEEPECHO_FEATURES: ghosttrace
    ports: ["8003:8000"]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8000:8000"]
    restart: unless-stopped
    # No depends_on: the gateway resolves a feature per request, so it starts
    # and stays up whichever features are running.

  frontend:
    build:
      context: ./frontend
      args:
        # The address the BROWSER uses for the API. Compiled into the bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    # 5173 because the API's default CORS list already allows it
    # (backend/config.py). On another port, set DEEPECHO_CORS_ORIGINS in .env.
    ports: ["5173:80"]
    restart: unless-stopped
