# Static files for the dashboard. No API proxying here on purpose: the app's own
# pages (/history, /detections, /ghosttrace) share their paths with API routes,
# so the API lives on a different origin, behind docker/gateway.conf.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths. A reload on /ghosttrace/some-survey has to
    # get index.html back, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever;
    # index.html must not be, or a new build is never picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
