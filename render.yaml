# Render blueprint. Two services: the API in a container, the dashboard as
# static files. The dashboard needs no container, since `npm run build` produces
# plain files Render serves for free.
services:
  - type: web
    name: deepecho-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The Dockerfile's PROFILE build arg defaults to `serve` (no torch), which
    # fits the free 512 MB instance. Render blueprints cannot pass build args;
    # for the `full` profile build the image elsewhere and move to >= 2 GB.
    healthCheckPath: /health
    envVars:
      # Groq answers in about a second; Gemini's free tier returns 503 under
      # load. Both are set so the failover has somewhere to go.
      - key: DEEPECHO_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Live upload is off on the free 512 MB instance. The serve image can
      # run the detector on final.onnx with no torch; set this to "1" on an
      # instance with at least 2 GB to let judges upload a sonar log live.
      - key: DEEPECHO_ENABLE_UPLOAD
        value: "0"
      # Supabase is optional. Without these the API still serves the assistant
      # and the surveys, and /health says why history is unavailable.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEEPECHO_CORS_ORIGINS
        value: https://deepecho-dashboard.onrender.com

  - type: web
    name: deepecho-dashboard
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://deepecho-api.onrender.com
