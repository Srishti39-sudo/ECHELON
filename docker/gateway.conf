# The API gateway: one address for the browser (http://localhost:8000), three
# feature containers behind it. This table is the whole routing policy. It must
# agree with the feature groups in backend/config.py (FEATURES): a path sent to
# a container that does not serve that feature is a 404 from FastAPI.
#
# To move a route to another feature, change its line here and the matching
# include_router in backend/app/main.py. To add a feature, add a service to
# compose.yaml, a name to config.ALL_FEATURES, and a line here.
map $uri $feature {
    default                                                     "";

    ~^/(chat|rag|sources)(/|$)                                  assistant;
    ~^/ghosttrace(/|$)                                          ghosttrace;
    ~^/(survey|hazard|history|stats|detections|detect|scans)(/|$)  hazard;

    # The dashboard's status badge reads the assistant's health. Each feature's
    # own /health is on its direct port (8001-8003) and under /_health/ below.
    /health                                                     assistant;
    /                                                           assistant;
}

server {
    listen 8000;

    # Docker's embedded DNS. With a variable in proxy_pass nginx resolves the
    # name per request instead of once at startup, which is what lets one
    # feature be stopped, rebuilt or never started without taking the gateway
    # down: its paths answer 502 and everything else keeps working.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A survey upload is up to 512 MB (DEEPECHO_MAX_SURVEY_UPLOAD_BYTES), and is
    # streamed through rather than spooled to the gateway's disk first.
    client_max_body_size 600m;
    proxy_request_buffering off;

    # /chat/stream and /survey/jobs/{id}/events are server-sent events. Buffered,
    # an answer arrives all at once at the end; with the default 60 s read
    # timeout, a quiet job stream is cut mid-survey.
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location ~ ^/_health/(assistant|hazard|ghosttrace)$ {
        proxy_pass http://$1:8000/health;
    }

    location / {
        default_type application/json;
        if ($feature = "") {
            return 404 '{"detail":"no feature owns this path; see docker/gateway.conf"}';
        }
        proxy_pass http://$feature:8000;
    }
}
